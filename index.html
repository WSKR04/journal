<style>
/* Layout: en-tête vitré et sticky (compte, résultat du jour, actions en haut à droite, filtres) puis dashboard en grille 12 colonnes. La fiche trade (onglets + barre d'enregistrement fixe), le journal du jour, l'import, le compte et le calculateur s'ouvrent en fenêtre. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EEF1F6; --line:#E1E5EC;
  --fg:#0E1320; --muted:#667085; --accent:#3F5FE0; --accent-ink:#FFFFFF; --accent-soft:#E7ECFD;
  --gain:#0E9F6E; --loss:#E0474C; --warn:#C77A12; --scrim:rgba(14,19,32,.5);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --r:14px;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C11; --surface:#10141B; --surface2:#171C25; --line:#222937;
  --fg:#E9EDF4; --muted:#8792A6; --accent:#7F9CFF; --accent-ink:#0A0E16; --accent-soft:#18213F;
  --gain:#3DD68C; --loss:#FF6E6E; --warn:#F5B14C; --scrim:rgba(0,0,0,.66); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090C11; --surface:#10141B; --surface2:#171C25; --line:#222937;
  --fg:#E9EDF4; --muted:#8792A6; --accent:#7F9CFF; --accent-ink:#0A0E16; --accent-soft:#18213F;
  --gain:#3DD68C; --loss:#FF6E6E; --warn:#F5B14C; --scrim:rgba(0,0,0,.66); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em}
#todayPill{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px;color:var(--muted);margin-right:auto;cursor:pointer;font-family:inherit}
#todayPill:hover{border-color:var(--muted)}
#todayPill b{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
#todayPill i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block}
#todayPill.g i{background:var(--gain)}#todayPill.l i{background:var(--loss)}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1320px;margin:10px auto 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 13px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--fg)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 50%,var(--line));background:none;box-shadow:none}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
kbd{font:500 10px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;margin-left:6px;opacity:.75}
.sel,#acctSel,#fInst{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:500;max-width:220px;box-shadow:var(--shadow)}
main{padding-top:18px}
h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.sm{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad,18px);min-width:0;box-shadow:var(--shadow);scroll-margin-top:130px}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.fillr{grid-column:span var(--sp)!important}.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;box-shadow:var(--shadow)}
.kt{min-width:0;flex:1}
.kt b{display:block;font:700 25px var(--f-display);letter-spacing:-.02em;margin:4px 0 2px;overflow-wrap:anywhere;line-height:1.1}
.kt small{color:var(--muted);font-size:12px;display:block}
.ring{width:46px;height:46px;flex:none}
.ring circle{fill:none;stroke-width:4.5}
.ring .tr{stroke:var(--surface2)}
.ring .gn{stroke:var(--gain);stroke-linecap:round}.ring .ls{stroke:var(--loss)}
.wlbar{display:flex;height:6px;border-radius:99px;overflow:hidden;margin-top:8px;gap:2px}
.wlbar i{display:block;height:100%}.wlbar .g{background:var(--gain)}.wlbar .l{background:var(--loss)}
.pos{color:var(--gain)}.neg{color:var(--loss)}.mut{color:var(--muted)}.wrn{color:var(--warn)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.grp td{background:var(--surface2);padding:8px 10px;border-bottom:1px solid var(--line)}.ths{all:unset;cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}.ths:hover,.ths.on{color:var(--fg)}.ths:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.emo{display:flex;gap:4px;align-items:center}.em{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font:500 12px var(--f-mono);padding:0}.em.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.em:hover{border-color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--surface2)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font:500 11px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.gain{color:var(--gain);border-color:color-mix(in srgb,var(--gain) 55%,var(--line))}.pill.loss{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 55%,var(--line))}.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.pill .x{background:none;border:0;cursor:pointer;padding:0 0 0 6px;color:inherit;font-size:13px;line-height:1}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
[hidden]{display:none!important}
.grpT{border-top:1px solid var(--line);padding-top:12px}.grpT>label{font-weight:600;color:var(--fg)}
.field>label,.lbl{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}

/* répartitions */
function hbars(rows){
  if(!rows.length)return '<div class="empty">Pas de données.</div>';
  var mx=Math.max.apply(null,rows.map(function(r){return Math.abs(r.pnl)}).concat([1]));
  return '<div>'+rows.map(function(r){return '<div class="hbr"><span class="hl" title="'+esc(r.k)+'">'+esc(r.k)+'</span><div class="hbt"><i class="'+(r.pnl>=0?'g':'l')+'" style="width:'+Math.max(2,Math.abs(r.pnl)/mx*100)+'%"></i></div><span class="hv mono '+cls(r.pnl)+'">'+money(r.pnl)+'</span><span class="hn mono mut">'+r.n+' · '+fmt(r.win*100,0)+' %</span></div>'}).join('')+'</div>'}
function splitRows(c,k){
  if(k==='instrument')return groupBy(c,function(t){return t.instrument});
  if(k==='session')return groupBy(c,function(t){return t.session},SESSIONS);
  if(k==='setup')return groupBy(c,function(t){return t.setup});
  if(k==='side')return groupBy(c,function(t){return t.sens==='SHORT'?'Short':'Long'},['Long','Short']);
  if(k==='hour'){var ord=[];for(var h=0;h<24;h++)ord.push(p2(h)+' h');return groupBy(c,function(t){var s=(t.openAt||t.closeAt||'').slice(11,13);return s?s+' h':''},ord)}
  if(k==='grade')return groupBy(c,function(t){return t.grade||'Non noté'},['A','B','C','Non noté']);
  if(k==='emoAfter'){var EA={1:'1 · tendu',2:'2 · irrité',3:'3 · neutre',4:'4 · concentré',5:'5 · serein'};return groupBy(c,function(t){return t.emoAfter?EA[t.emoAfter]:''},[EA[1],EA[2],EA[3],EA[4],EA[5]])}
  if(k==='emo'){var EL={1:'1 · tendu',2:'2 · irrité',3:'3 · neutre',4:'4 · concentré',5:'5 · serein'};return groupBy(c,function(t){return t.emo?EL[t.emo]:''},[EL[1],EL[2],EL[3],EL[4],EL[5]])}
  if(k==='dur')return groupBy(c,function(t){var d=durMin(t);return d==null?'':(d<5?'< 5 min':(d<15?'5 – 15 min':(d<60?'15 – 60 min':(d<240?'1 – 4 h':'> 4 h'))))},['< 5 min','5 – 15 min','15 – 60 min','1 – 4 h','> 4 h'])
  if(k==='news'){var NL={faible:'Faible',moyen:'Moyen',fort:'Fort'},NR={avant:'avant',pendant:'pendant',apres:'après'};return groupBy(c,function(t){return t.news?(NL[t.news]||t.news)+(t.newsRel?' · '+(NR[t.newsRel]||t.newsRel):''):'Sans news'})}
  if(k==='tag'){var m={};c.forEach(function(t){tagsOf(t).forEach(function(g){(m[g]=m[g]||[]).push(t)})});return Object.keys(m).map(function(g){var a=agg(m[g]);a.k=g;return a}).sort(function(a,b){return b.n-a.n})}
  return groupBy(c,dowOf,DOW)}

  $('#splitCard').innerHTML='<header><h2>Répartition du P&amp;L</h2>'+seg('split',k,[['instrument','Instrument'],['side','Sens'],['session','Session'],['dow','Jour'],['hour','Heure'],['setup','Setup'],['tag','Tag'],['news','News'],['grade','Qualité'],['emo','Émotion avant'],['emoAfter','Émotion après'],['dur','Durée']])+'</header>'+hbars(rows)+
    (rows.length?'<div class="mut" style="font-size:11px;margin-top:8px">Barre = P&amp;L · à droite : nombre de trades · win rate</div>':'');

function drawQual(c){

    var rows=Object.keys(mk).map(function(x){var g=agg(mk[x]);g.k=x;return g}).sort(function(a,b){return a.pnl-b.pnl});

  }else if(k==='chk'){

    if(!cl.length)h='<div class="empty">Définis ta checklist dans « Compte » puis coche-la dans l\'onglet Analyse des trades.</div>';
    else{var dn=c.filter(function(t){return chkDone(t)===cl.length}),ic=c.filter(function(t){return chkDone(t)!==cl.length}),rr2=[];
      if(dn.length){var g1=agg(dn);g1.k='Checklist complète';rr2.push(g1)}if(ic.length){var g2=agg(ic);g2.k='Checklist incomplète';rr2.push(g2)}
      h=hbars(rr2)+'<div class="mut" style="font-size:11px;margin-top:8px">Les trades sans checklist cochée comptent comme incomplets.</div>'}

  pts.forEach(function(p,i){var up=(i===0?p[0]>pts[1][0]:(i===n-1?p[0]>pts[n-2][0]:p[0]>pts[i-1][0])),y=Y(p[0]);g+='<circle class="pt" cx="'+f(X(i))+'" cy="'+f(y)+'" r="3"/>'+(p[1]?'<text class="an" x="'+f(X(i))+'" y="'+f(up?y-8:y+16)+'" text-anchor="middle">'+esc(p[1])+'</text>':'')});

function lrChart(b){var rows=String(b.v||'').split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).slice(0,400),C=[],V=[],Lb=[];

var LRN=[
 {k:'struct',id:'lrStruct',t:'🧱 Market Structure',tag:'BOS · CHoCH · MSS',cap:'Tendance haussière (HH / HL), deux BOS, puis CHoCH quand le dernier HL protégé casse.',
  fig:function(){return svgZ([[40,''],[70,'H'],[55,'HL'],[90,'HH'],[72,'HL'],[100,'HH'],[62,'']],{lab:'Structure de marché',l:[{i0:1,i1:3,y:70,t:'BOS'},{i0:3,i1:5,y:90,t:'BOS'},{i0:4,i1:6,y:72,t:'CHoCH',c:'r'}]})},
  body:'<p>La structure dit <b>qui contrôle le marché</b>. Un <b>swing high</b> est un sommet entouré de sommets plus bas ; un <b>swing low</b>, un creux entouré de creux plus hauts.</p><ul><li><b>Tendance haussière</b> : Higher Highs (HH) + Higher Lows (HL). <b>Baissière</b> : Lower Highs (LH) + Lower Lows (LL).</li><li><b>BOS</b> (Break of Structure) : clôture au-delà du dernier sommet (ou creux) dans le sens de la tendance → <b>continuation</b>.</li><li><b>CHoCH</b> (Change of Character) : première cassure du dernier creux protégé (en tendance haussière) → <b>premier signe de retournement</b>.</li><li><b>MSS</b> (Market Structure Shift) : CHoCH réalisé avec <b>displacement</b> (bougies impulsives qui laissent souvent un FVG). C’est le signal le plus fiable.</li><li><b>Structure externe</b> (swings majeurs, HTF) vs <b>interne</b> (petits swings dans un leg) : on lit l’externe pour le biais, l’interne pour l’entrée.</li></ul>',
  keys:['Une cassure se valide par une <b>clôture du corps</b>, pas par une mèche : une mèche au-delà = souvent une prise de liquidité.','Repère toujours le <b>dernier HL / LH protégé</b> : c’est lui qui invalide la tendance.','Lis du <b>HTF vers le LTF</b> : biais en D1 / H4, confirmation en H1, entrée en M15 / M5.','Pas de displacement = pas de MSS fiable.']},
 {k:'liq',id:'lrLiq',t:'💧 Liquidity',tag:'BSL · SSL · Sweep',cap:'Equal highs = liquidité acheteuse (BSL). Le prix la prend (sweep), clôture dessous puis part dans l’autre sens.',
  fig:function(){return svgC([[10,12,9.6,11.6],[11.6,14,11.2,13.4],[13.4,13.8,11.8,12.2],[12.2,13.98,11.9,13.5],[13.5,13.6,12.2,12.5],[12.5,15.2,12.3,13.2],[13.2,13.4,10.6,10.9],[10.9,11.4,9.2,9.5],[9.5,9.8,8.4,8.7]],{lab:'Prise de liquidité',l:[{i0:1,i1:8,y:14,t:'BSL (equal highs)'},{i0:0,i1:8,y:9.6,t:'SSL',c:'r'}],a:[{i:5,t:'Sweep'}],hl:[5]})},
  body:'<p>La liquidité, ce sont les <b>ordres en attente</b> (stops et ordres d’entrée) que les gros acteurs utilisent pour remplir leurs positions. Le prix se déplace <b>d’une zone de liquidité à l’autre</b>.</p><ul><li><b>BSL</b> (Buy Side Liquidity) : au-dessus des sommets (stops des vendeurs, buy stops des breakouts).</li><li><b>SSL</b> (Sell Side Liquidity) : sous les creux.</li><li><b>Equal highs / lows</b> (EQH / EQL) : sommets ou creux alignés = liquidité évidente, véritables aimants.</li><li>Niveaux clés : <b>high / low de la session asiatique</b>, <b>PDH / PDL</b> (jour précédent), <b>PWH / PWL</b> (semaine précédente).</li><li><b>Sweep / stop hunt</b> : le prix dépasse le niveau, déclenche les stops, puis <b>réintègre</b> rapidement (Judas swing à l’ouverture de Londres ou de New York).</li><li><b>Inducement</b> : petit sommet ou creux juste avant ta zone, qui sert d’appât. On attend qu’il soit pris.</li><li><b>Draw on Liquidity</b> (DOL) : la liquidité vers laquelle le prix est « aimanté » = ta cible.</li></ul>',
  keys:['Après un sweep, <b>attends un MSS avec displacement</b> avant d’entrer : le sweep seul n’est pas un signal.','Ta cible = la <b>liquidité opposée</b> (le DOL).','Ne place pas ton stop pile sur un niveau évident : il fait partie de la liquidité.','Le prix va de la liquidité vers l’inefficience (FVG), puis de l’inefficience vers la liquidité.']},
 {k:'fvg',id:'lrFvg',t:'🕳️ Fair Value Gap (FVG)',tag:'Imbalance · CE · IFVG',cap:'FVG haussier : écart entre le haut de la bougie 1 et le bas de la bougie 3. Le prix revient le tester puis repart.',
  fig:function(){return svgC([[10,11.2,9.4,10.8],[10.8,12,10.3,11.6],[11.6,16.4,11.4,16],[16,17,14,16.6],[16.6,17.4,15.6,16.2],[16.2,16.4,13.3,13.8],[13.8,19,13.6,18.6]],{lab:'Fair Value Gap haussier',z:[{i0:1,i1:6,y0:12,y1:14,t:'FVG haussier'}],l:[{i0:1,i1:6,y:13,t:'CE 50 %',c:'a',s:1}],a:[{i:1,t:'1',b:1},{i:2,t:'2',b:1},{i:3,t:'3'}],hl:[1,2,3]})},
  body:'<p>Un FVG est un <b>déséquilibre sur 3 bougies</b> : la bougie du milieu est si impulsive que les mèches des bougies 1 et 3 ne se chevauchent pas. Le prix a été livré <b>dans un seul sens</b> ; il revient souvent « rééquilibrer » la zone.</p><ul><li><b>FVG haussier</b> : entre le <b>haut de la bougie 1</b> et le <b>bas de la bougie 3</b>. Support potentiel.</li><li><b>FVG baissier</b> : entre le <b>bas de la bougie 1</b> et le <b>haut de la bougie 3</b>. Résistance potentielle.</li><li><b>CE</b> (Consequent Encroachment) : le <b>50 %</b> du FVG. La réaction se fait souvent au CE ; une clôture au-delà affaiblit la zone.</li><li><b>IFVG</b> (Inversion FVG) : un FVG traversé et clôturé de l’autre côté <b>change de rôle</b> (support ↔ résistance).</li><li><b>BPR</b> (Balanced Price Range) : chevauchement d’un FVG haussier et d’un FVG baissier = zone très réactive.</li></ul><p><b>Un bon FVG</b> : créé par displacement, dans le sens du biais HTF, après une prise de liquidité, en discount (achat) ou en premium (vente), pas encore mitigé.</p>',
  keys:['Un FVG <b>n’est pas un signal à lui seul</b> : il faut le contexte (biais, sweep, MSS).','FVG <b>HTF</b> &gt; FVG LTF. Ignore les micro-FVG au milieu d’un range.','Entrée : limite au bord du FVG ou au CE. Stop : sous la bougie 1 (ou sous le swing).','FVG déjà rempli à 100 % = zone usée.']},
 {k:'ob',id:'lrOb',t:'📦 Order Blocks',tag:'OB · Breaker · Mitigation',cap:'OB haussier : dernière bougie baissière avant l’impulsion qui casse la structure (BOS). Le retour dans l’OB offre l’entrée.',
  fig:function(){return svgC([[15,15.4,13.8,14.1],[14.1,14.5,12.6,12.9],[12.9,13.3,11.6,12],[12,16.6,11.9,16.3],[16.3,17.6,16,17.3],[17.3,17.5,13.9,14.4],[14.4,14.6,12.5,13.4],[13.4,19,13.2,18.7]],{lab:'Order block haussier',z:[{i0:2,i1:7,y0:11.6,y1:12.9,t:'OB haussier',c:'g'},{i0:2,i1:4,y0:13.3,y1:16,t:'FVG',c:'f'}],l:[{i0:0,i1:4,y:15.4,t:'BOS'},{i0:2,i1:7,y:12.45,t:'MT 50 %',c:'a',s:1}],a:[{i:2,t:'OB',b:1}],hl:[2]})},
  body:'<p>Un order block marque la zone où les <b>institutions ont accumulé leurs ordres</b> juste avant un mouvement fort.</p><ul><li><b>OB haussier</b> : la <b>dernière bougie baissière</b> avant l’impulsion haussière qui casse la structure. <b>OB baissier</b> : la dernière bougie haussière avant l’impulsion baissière.</li><li>Zone : de l’<b>ouverture</b> (ou du haut) au <b>bas</b> de la bougie. <b>Mean Threshold</b> (MT) = 50 % du corps : un OB sain tient au-dessus.</li><li><b>Critères de validité</b> : displacement après l’OB, FVG laissé derrière, BOS ou MSS, liquidité prise avant, zone non mitigée, alignée avec le biais HTF.</li><li><b>Breaker block</b> : un OB qui a échoué (le prix l’a traversé après un sweep) et qui sert ensuite dans l’autre sens.</li><li><b>Mitigation block</b> : comme le breaker, mais sans prise de liquidité préalable (failure swing).</li><li><b>Rejection block</b> : zone de longues mèches à un extrême.</li></ul>',
  keys:['<b>OB + FVG</b> qui se recoupent = confluence forte.','Un OB déjà testé perd de sa force.','OB haussier <b>invalidé</b> si le prix clôture sous son bas.','Préfère les OB situés en discount (achat) ou en premium (vente).']},
 {k:'pd',id:'lrPd',t:'⚖️ Premium / Discount & OTE',tag:'Equilibrium · Fibonacci',cap:'Sur le leg qui a fait le BOS : au-dessus de 50 % = premium (cher), en dessous = discount (bon marché). OTE = retracement 62–79 %.',
  fig:function(){return svgZ([[30,'Swing low'],[100,'Swing high'],[52,'Entrée OTE'],[124,'Cible']],{lab:'Premium, discount et OTE',z:[{y0:65,y1:100,t:'Premium',c:'r'},{y0:30,y1:65,t:'Discount',c:'g'},{y0:44.7,y1:56.6,t:'OTE 62–79 %',c:'a',i0:1,i1:3}],l:[{y:65,t:'50 % equilibrium'}]})},
  body:'<p>On découpe le dernier <b>leg impulsif</b> (du swing low au swing high pour un achat) avec Fibonacci.</p><ul><li><b>Equilibrium</b> = 50 % du range.</li><li><b>Premium</b> (au-dessus de 50 %) : zone où l’on cherche à <b>vendre</b>.</li><li><b>Discount</b> (sous 50 %) : zone où l’on cherche à <b>acheter</b>.</li><li><b>OTE</b> (Optimal Trade Entry) : retracement entre <b>62 % et 79 %</b>, niveau clé <b>70,5 %</b>. Idéal quand un FVG ou un OB s’y trouve.</li><li><b>Cibles</b> : liquidité opposée, ou extensions Fibonacci <b>−0,27</b> et <b>−0,62</b> pour les prises de profit partielles.</li></ul>',

 {k:'time',id:'lrTime',t:'⏰ Killzones & Sessions',tag:'Heure de Bruxelles',cap:'Killzones calculées pour aujourd’hui en heure de Bruxelles. Trait rouge = maintenant.',fig:kzFig,body:null,

 {k:'entry',id:'lrEntry',t:'🎯 Entry Models',tag:'Sweep → MSS → FVG',cap:null,fig:null,
  body:'<div class="lrmd"><div><div class="lbl">Modèle 1 · Sweep → MSS → FVG</div><ol><li>Biais HTF (D1 / H4) clair et cible (DOL) identifiée.</li><li>Dans une killzone, le prix <b>prend une liquidité</b> (high / low d’Asie, PDH / PDL).</li><li><b>MSS avec displacement</b> sur M5 / M15 dans le sens du biais.</li><li>Entrée sur le <b>FVG</b> (ou l’OB) créé par le displacement, de préférence en discount / premium.</li><li>Stop au-delà du swing du sweep. Cible : liquidité opposée. <b>R:R ≥ 2</b>.</li></ol></div>'+

 {k:'risk',id:'lrRisk',t:'🛡️ Risk Management',tag:'Taille · Stop · R:R',cap:null,fig:null,
  body:'<ul><li><b>Risque fixe</b> par trade (0,5 à 1 % du compte), calculé depuis la distance du stop : utilise le calculateur de position.</li><li>Stop <b>structurel</b> (derrière le swing ou la zone), jamais un stop « au feeling ».</li><li><b>R:R minimum 2</b> ; prends des partiels sur la première liquidité, passe le reste à break-even.</li><li><b>Limite quotidienne</b> : un nombre maximum de trades et de pertes consécutives (réglable dans Compte et règles).</li><li>Après 2 pertes d’affilée : <b>stop pour la journée</b>.</li><li>Journalise <b>chaque</b> trade, gagnant ou perdant, avec capture et émotion.</li></ul><div class="actions" style="margin-top:12px"><button class="btn sm" data-act="mCalc" data-need="acct">🧮 Calculateur de lot</button><button class="btn sm" data-act="mAcct" data-need="acct">👤 Mes règles</button><button class="btn sm" data-act="new" data-need="acct">➕ Nouveau trade</button></div>',

 {k:'sweep',id:'lrSweep',t:'🧹 Liquidity Sweep',tag:'Sweep · Breakout · Plan',cap:'Equal lows = SSL. Une mèche passe dessous, la bougie clôture dans le range, puis un displacement haussier part vers la BSL.',
  fig:function(){return svgC([[13,13.4,11.9,12.2],[12.2,12.6,10.05,10.6],[10.6,12.3,10.4,12],[12,12.4,10.1,10.5],[10.5,11.2,10.3,11],[11,11.1,8.9,10.6],[10.6,12.8,10.5,12.6],[12.6,13.9,12.4,13.7],[13.7,14.6,13.5,14.4]],{lab:'Liquidity sweep haussier',l:[{i0:1,i1:5,y:10.05,c:'r'},{i0:0,i1:8,y:14.6,t:'Cible : BSL'}],z:[{i0:1,i1:4,y0:9.95,y1:10.15,t:'',c:'r'}],a:[{i:5,t:'Sweep',b:1},{i:6,t:'Displacement'}],hl:[5,6]})},
  body:'<p>Un <b>sweep</b> (ou <i>stop hunt</i>) est une incursion rapide au-delà d’une zone de liquidité, suivie d’un <b>retour dans le range</b>. Le prix déclenche les stops et les ordres de breakout, puis repart dans l’autre sens : la liquidité a servi à remplir des positions opposées.</p>'+
   '<div class="lbl">Où se trouve la liquidité</div><ul><li><b>Equal highs / lows</b> (EQH / EQL) : les plus évidents, donc les plus visés.</li><li><b>Haut / bas de session</b> : Asie, Londres, PDH / PDL, PWH / PWL.</li><li><b>Swings récents</b> et <b>lignes de tendance</b> (liquidité « trendline »).</li><li><b>Chiffres ronds</b> (ex. 4 000 sur l’or, 1,1000 sur EURUSD).</li></ul>'+
   '<div class="lbl">Sweep ou vrai breakout ?</div><table class="tbl"><thead><tr><th></th><th>Sweep</th><th>Breakout</th></tr></thead><tbody><tr><td>Clôture</td><td>Revient <b>dans</b> le range</td><td>Clôture <b>au-delà</b></td></tr><tr><td>Mèche</td><td>Longue, rejet rapide</td><td>Corps plein</td></tr><tr><td>Suite</td><td>Displacement opposé + MSS</td><td>Retest du niveau qui tient</td></tr><tr><td>Contexte</td><td>Contre le niveau, souvent en killzone</td><td>Dans le sens du biais HTF</td></tr></tbody></table>'+
   '<div class="lbl">Plan type</div><ol><li>Repère la liquidité visée et le <b>biais HTF</b> (on achète un sweep de SSL en biais haussier).</li><li>Attends la prise <b>dans une killzone</b>.</li><li>Exige un <b>MSS avec displacement</b> sur M5 / M15.</li><li>Entrée au retour dans le <b>FVG</b> créé par le displacement.</li><li>Stop au-delà de la <b>mèche du sweep</b> ; cible la <b>liquidité opposée</b>.</li></ol>',
  keys:['Une mèche au-delà d’un niveau n’est pas une cassure : <b>la clôture décide</b>.','Pas de MSS après le sweep = pas d’entrée (le prix peut continuer).','Le stop derrière la mèche du sweep est logique : si elle est reprise, l’idée est fausse.','Les sweeps de la session asiatique pendant Londres ou New York sont les plus fiables.']},
 {k:'disp',id:'lrDisp',t:'⚡ Displacement & Gaps',tag:'VI · Void · NWOG',cap:'Displacement haussier : grosses bougies à corps plein qui laissent un BISI (FVG haussier) et un volume imbalance (bande orange), revisités avant la suite.',
  fig:function(){return svgC([[10,10.6,9.6,10.3],[10.3,10.8,10,10.6],[10.6,13.6,10.5,13.2],[13.5,15.8,13.3,15.5],[15.5,16.2,14.4,15.9],[15.9,16.1,12.8,13.4],[13.4,17.5,13.2,17.2]],{lab:'Displacement et gaps',z:[{i0:1,i1:6,y0:10.8,y1:13.3,t:'BISI',c:'g',s:1},{i0:2,i1:6,y0:13.2,y1:13.5,c:'f'}],a:[{i:3,t:'Displacement',y:16.9}],hl:[2,3]})},
  body:'<p>Le <b>displacement</b> est un mouvement <b>impulsif et rapide</b> : grandes bougies, corps pleins, peu de mèches. Il montre l’intervention des gros acteurs, casse la structure (MSS) et laisse des <b>inefficiences</b> que le prix revient souvent rééquilibrer.</p>'+
   '<div class="lbl">Les gaps à connaître</div><ul><li><b>BISI</b> (Buy Side Imbalance, Sell Side Inefficiency) : FVG <b>haussier</b>. <b>SIBI</b> : FVG <b>baissier</b>.</li><li><b>Volume imbalance (VI)</b> : les <b>corps</b> de deux bougies ne se touchent pas, mais leurs mèches se chevauchent.</li><li><b>Liquidity void</b> : longue série de bougies dans un seul sens, sans retracement. Zone vide souvent comblée plus tard.</li><li><b>NWOG</b> (New Week Opening Gap) : écart entre la clôture du vendredi et la réouverture du dimanche.</li><li><b>NDOG</b> (New Day Opening Gap) : écart entre la clôture de 17:00 et la réouverture de 18:00 (heure de New York, futures).</li></ul>'+
   '<p>Un vrai displacement <b>casse un swing</b> avec une clôture. Une grosse bougie au milieu d’un range n’en est pas un.</p>',
  keys:['Pas de displacement = pas de MSS valide.','Le premier FVG créé par le displacement est la zone d’entrée prioritaire.','Le CE (50 %) d’un NWOG sert souvent d’aimant ou de support / résistance pendant la semaine.','Un gap comblé d’un coup, sans réaction, perd sa valeur.']},
 {k:'breaker',id:'lrBreaker',t:'🔁 Breaker Blocks',tag:'Breaker · Mitigation',cap:'Breaker haussier : le prix prend la liquidité sous le creux, casse le sommet « H » avec displacement. La zone de la bougie haussière qui a formé « H » devient un support.',
  fig:function(){return svgZ([[60,''],[80,''],[50,'Low'],[70,'H'],[40,'Sweep'],[88,''],[66,'Retest'],[108,'']],{lab:'Breaker block haussier',z:[{i0:3,i1:7,y0:62,y1:70,t:'Breaker',c:'g',tx:6.3}],l:[{i0:3,i1:4.3,y:70,t:'MSS'},{i0:1.3,i1:4,y:50,t:'SSL',c:'r',s:1}]})},
  body:'<p>Un <b>breaker</b> est un order block qui a <b>échoué</b> et change de camp. Il apparaît après un <b>sweep</b> suivi d’un <b>MSS</b>.</p>'+
   '<ul><li><b>Breaker haussier</b> : le prix fait un sommet (H), descend <b>sous le creux précédent</b> (sweep de SSL), puis remonte et <b>clôture au-dessus de H</b>. La dernière bougie (ou série) <b>haussière</b> avant la chute vers le sweep devient la zone d’achat.</li><li><b>Breaker baissier</b> : symétrique (sweep d’un sommet, cassure du creux, la dernière bougie baissière devient la zone de vente).</li><li><b>Mitigation block</b> : même schéma <b>sans sweep</b> (le prix fait un creux plus haut au lieu d’un plus bas). Plus faible qu’un breaker.</li></ul>'+
   '<p><b>Entrée</b> : au retour dans la zone, idéalement avec un FVG qui la recoupe. <b>Stop</b> : sous le bas de la zone (ou sous le sweep). <b>Invalidation</b> : clôture franche de l’autre côté.</p>',
  keys:['Sans sweep préalable, ce n’est pas un breaker mais un mitigation block.','Breaker + FVG + discount = confluence de premier choix.','La cassure doit se faire avec displacement et clôture du corps.','Un breaker déjà retesté plusieurs fois s’use.']},
 {k:'po3',id:'lrPo3',t:'🕛 Power of 3',tag:'AMD · Midnight open',cap:'Journée haussière type : accumulation autour de l’ouverture de minuit, manipulation sous l’ouverture (sweep), puis distribution vers le haut.',
  fig:function(){return svgZ([[50,''],[54,''],[47,''],[52,''],[36,'Manipulation'],[60,''],[55,''],[82,''],[77,''],[96,'Distribution']],{lab:'Power of 3 (AMD)',z:[{i0:0,i1:3,y0:45,y1:56,t:'Accumulation',c:'a',tp:'above'}],l:[{i0:4,y:50,t:'Midnight open',c:'a'}]})},
  body:'<p>Le <b>Power of 3</b> (AMD) décrit la construction d’une bougie (journée, semaine) en trois temps :</p><ol><li><b>Accumulation</b> : range calme, souvent en session asiatique, autour de l’ouverture.</li><li><b>Manipulation</b> : faux départ <b>contre</b> le vrai sens (Judas swing) qui prend la liquidité, souvent à l’ouverture de Londres.</li><li><b>Distribution</b> : vrai mouvement de la journée, souvent pendant Londres et New York AM.</li></ol>'+
   '<p>Le <b>midnight open</b> (00:00 heure de New York, soit 6 h à Bruxelles, 5 h les semaines où les changements d’heure ne coïncident pas) sert de repère : en biais <b>haussier</b>, on cherche à acheter <b>sous</b> l’ouverture (la manipulation) ; en biais <b>baissier</b>, à vendre <b>au-dessus</b>.</p>'+
   '<p>Même logique sur la semaine : lundi / mardi forment souvent l’extrême (manipulation), mercredi / jeudi la distribution.</p>',
  keys:['Une bougie haussière = Open → Low → High → Close : le bas se forme tôt.','N’achète pas la manipulation trop tôt : attends le sweep puis le MSS.','En biais haussier, un prix au-dessus du midnight open = premium : patience.','Les jours de news 🔴, l’ordre AMD peut être décalé à l’heure de la publication.']},
 {k:'smt',id:'lrSmt',t:'🔀 SMT Divergence',tag:'EURUSD · GBPUSD · DXY',cap:'SMT haussière : EURUSD fait un plus bas plus bas, GBPUSD ne confirme pas (plus bas plus haut). La faiblesse vendeuse annonce un retournement.',
  fig:function(){return '<div class="lrdbl">'+svgZ([[70,''],[50,'Low 1'],[64,''],[42,'LL'],[72,'']],{lab:'EURUSD',h:130,ti:'EURUSD',l:[{i0:1,i1:3,y:50,c:'r'}]})+svgZ([[70,''],[48,'Low 1'],[62,''],[53,'HL'],[76,'']],{lab:'GBPUSD',h:130,ti:'GBPUSD',cl:'ac',l:[{i0:1,i1:3,y:48}]})+'</div>'},
  body:'<p>Une <b>SMT divergence</b> (Smart Money Technique) compare deux actifs <b>corrélés</b>. Quand l’un fait un nouvel extrême et que l’autre <b>ne le confirme pas</b>, le mouvement manque de soutien.</p>'+
   '<ul><li><b>SMT haussière</b> : actif A fait un <b>plus bas plus bas</b>, actif B un <b>plus bas plus haut</b>. Signal d’achat potentiel.</li><li><b>SMT baissière</b> : A fait un <b>plus haut plus haut</b>, B un <b>plus haut plus bas</b>.</li></ul>'+
   '<div class="lbl">Paires utiles</div><ul><li>EURUSD ↔ GBPUSD (corrélés), EURUSD ↔ <b>DXY</b> (corrélation inverse : on compare un creux d’EURUSD à un sommet du DXY).</li><li>NAS100 ↔ S&amp;P 500 ↔ Dow Jones.</li><li>Or ↔ argent (XAUUSD ↔ XAGUSD).</li></ul>'+
   '<p>La SMT se lit <b>au niveau d’une zone clé</b> (sweep d’une liquidité, PD array HTF), dans une killzone, puis se confirme par un MSS.</p>',
  keys:['Compare des swings du même moment, sur la même unité de temps.','Une SMT au milieu de nulle part ne vaut rien : il faut un niveau HTF.','Entre sur l’actif <b>le plus fort</b> (celui qui ne confirme pas) pour un achat.','La SMT n’est pas une entrée : attends le MSS.']},
 {k:'mmm',id:'lrMmm',t:'🏦 Market Maker Model',tag:'MMBM · MMSM · SMR',cap:'MMBM : consolidation initiale, programme de vente en escalier jusqu’à un PD array HTF, smart money reversal, puis programme d’achat en miroir jusqu’à la consolidation initiale.',
  fig:function(){return svgZ([[100,''],[96,''],[104,''],[80,''],[86,''],[64,''],[70,''],[46,'SMR'],[62,''],[56,''],[76,''],[72,''],[98,''],[94,''],[110,'Cible']],{lab:'Market Maker Buy Model',z:[{i0:0,i1:2,y0:94,y1:106,t:'Consolidation',c:'a',tp:'above'},{i0:6,i1:9,y0:42,y1:52,t:'PD array HTF',c:'g',tp:'left'}],l:[{i0:2,i1:14,y:104}]})},
  body:'<p>Le <b>Market Maker Buy Model</b> (MMBM) décrit un cycle complet en <b>deux branches</b> :</p><ol><li><b>Consolidation initiale</b> : range dont les sommets concentrent la liquidité visée à la fin.</li><li><b>Sell program</b> (branche descendante) : creux et sommets plus bas, avec de petites consolidations. Il amène le prix vers un <b>PD array HTF</b> en discount (FVG, OB, SSL).</li><li><b>Smart Money Reversal (SMR)</b> : sweep de liquidité au niveau du PD array + <b>MSS avec displacement</b>.</li><li><b>Buy program</b> (branche montante) : souvent le <b>miroir</b> de la branche descendante, en revisitant les mêmes niveaux.</li><li><b>Cible</b> : la liquidité au-dessus de la consolidation initiale.</li></ol>'+
   '<p>Le <b>MMSM</b> (Sell Model) est l’inverse : consolidation basse, buy program vers un premium HTF, SMR, puis sell program.</p>',
  keys:['Entrée : après le SMR, au retour dans le premier FVG du buy program.','Les anciennes consolidations de la branche descendante servent de cibles partielles.','Si le prix ne réagit pas au PD array HTF, le modèle n’est pas actif.','Identifie le modèle sur H1 / H4, exécute sur M5 / M15.']},
 {k:'wyck',id:'lrWyck',t:'📐 Wyckoff',tag:'Spring · SOS · UTAD',cap:'Schéma d’accumulation : stop de la baisse (PS, SC), range (AR, ST), fausse cassure sous le range (Spring), puis sortie par le haut (SOS, LPS).',
  fig:function(){return svgZ([[100,'PS'],[60,'SC'],[85,'AR'],[64,'ST'],[80,''],[66,''],[52,'Spring'],[70,'Test'],[90,'SOS'],[79,'LPS'],[112,'']],{lab:'Accumulation de Wyckoff',z:[{i0:1,i1:8,y0:60,y1:85,c:'a'}],l:[{i0:2,i1:9,y:85}]})},
  body:'<p>La méthode <b>Wyckoff</b> lit les phases où les gros acteurs <b>accumulent</b> (achètent discrètement) puis <b>distribuent</b> (revendent).</p>'+
   '<div class="lbl">Accumulation</div><ul><li><b>PS</b> (Preliminary Support) : premier achat qui freine la baisse.</li><li><b>SC</b> (Selling Climax) : capitulation, volume extrême, bas du range.</li><li><b>AR</b> (Automatic Rally) : rebond qui fixe le haut du range.</li><li><b>ST</b> (Secondary Test) : retour vers le SC, avec moins de volume.</li><li><b>Spring</b> : fausse cassure sous le range (= <b>sweep de SSL</b>), puis <b>Test</b>.</li><li><b>SOS</b> (Sign of Strength) : sortie par le haut avec force (= <b>MSS + displacement</b>).</li><li><b>LPS</b> (Last Point of Support) : dernier repli avant la hausse (= retest d’un OB / FVG).</li></ul>'+
   '<div class="lbl">Distribution (inverse)</div><p>PSY, <b>BC</b> (Buying Climax), AR, ST, <b>UTAD</b> (Upthrust After Distribution : fausse cassure au-dessus), <b>SOW</b> (Sign of Weakness), <b>LPSY</b>.</p>'+
   '<p>Phases : <b>A</b> arrêt de la tendance · <b>B</b> construction du range · <b>C</b> test (Spring / UTAD) · <b>D</b> sortie du range · <b>E</b> tendance.</p>',
  keys:['Le Spring est le moment clé : c’est le sweep des stops sous le range.','N’achète pas le milieu du range (phase B) : attends la phase C ou D.','Volume en baisse sur les tests = vendeurs épuisés.','Le LPS offre la meilleure entrée risque / rendement.']}
]);

.','Espérance ':'Gain moyen par trade.','Score de discipline':'Note sur 100 basée sur le respect de tes règles et de ton plan.','Risque ouvert':'Somme que tu perdrais si toutes tes positions ouvertes touchaient leur stop-loss.','Risque total ouvert':'Somme que tu perdrais si toutes tes positions ouvertes touchaient leur stop-loss.','Slippage +30 %':'Ta perte si l\'exécution est 30 % moins bonne que prévu (spread, glissement).','Probabilité de ruine':'Probabilité, d\'après tes résultats, de perdre le pourcentage indiqué de ton compte.','Budget de perte restant':'Ce que tu peux encore perdre aujourd\'hui avant d\'atteindre ta limite quotidienne.','Distance au seuil de perte max':'Marge restante avant la perte maximale autorisée du compte.','Lots pour le risque prévu':'Taille de position qui respecte le risque choisi (en % du compte).','Swap':'Frais (ou gain) de financement payés quand une position reste ouverte la nuit.','Pip':'Plus petite variation de prix habituelle d\'une paire (0,0001 sur EURUSD).'};
