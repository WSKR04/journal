name: Journal en ligne
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site et les données
        env:
          FORCE: ${{ github.event_name == 'schedule' && '0' || '1' }}
        run: |
          mkdir -p _site && cp index.html _site/ && touch _site/.nojekyll
          O="${GITHUB_REPOSITORY_OWNER,,}"; R="${GITHUB_REPOSITORY#*/}"
          if [ "${R,,}" = "$O.github.io" ]; then BASE="https://$O.github.io"; else BASE="https://$O.github.io/$R"; fi
          bash outils/maj_donnees.sh "$PWD/_site" "$BASE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
